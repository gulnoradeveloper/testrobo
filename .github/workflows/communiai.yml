name: CommuniAI CI

on:
  push:
    paths:
      - "communiai/**"
      - ".github/workflows/communiai.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    name: Backend tests (FastAPI + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: communiai
          POSTGRES_PASSWORD: communiai
          POSTGRES_DB: communiai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U communiai" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: communiai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: communiai/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly
        env:
          DATABASE_URL: postgresql+psycopg://communiai:communiai@localhost:5432/communiai_test
        run: alembic upgrade head && alembic downgrade base
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://communiai:communiai@localhost:5432/communiai_test
        run: pytest

  android:
    name: Flutter tests + Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: communiai/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build release APK (HTTPS only)
        run: flutter build apk --release
      - name: Verify APK keeps classes used via JNI (startup regression guard)
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          rm -rf /tmp/apkcheck && mkdir /tmp/apkcheck && unzip -q "$APK" 'classes*.dex' -d /tmp/apkcheck
          for c in 'Lkotlin/Unit;' 'Lio/flutter/plugins/sharedpreferences/StringListResult;' \
                   'Lio/flutter/embedding/android/FlutterActivity;' 'Luz/communiai/communiai/MainActivity;'; do
            if cat /tmp/apkcheck/classes*.dex | grep -a -q "$c"; then echo "OK  $c"; else echo "MISSING $c"; exit 1; fi
          done
      - name: Copy release APK
        run: mkdir -p ../../dist && cp build/app/outputs/flutter-apk/app-release.apk ../../dist/CommuniAI-1.0.0-release.apk
      - name: Build dev APK (allows HTTP to a local-network backend)
        run: flutter build apk --release --android-project-arg=allowCleartext=true
      - name: Collect APKs
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ../../dist/CommuniAI-1.0.0-dev-http.apk
          cd ../../dist && sha256sum *.apk > SHA256SUMS.txt && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: communiai-apk
          path: dist/

  android-smoke:
    name: Android emulator test (install, launch, login over network)
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: communiai-apk
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: communiai/backend/requirements*.txt
      - name: Start the backend on the CI host (emulator reaches it at 10.0.2.2:8000)
        working-directory: communiai/backend
        env:
          AI_PROVIDER: disabled
        run: |
          pip install -q -r requirements.txt
          nohup python run_local.py > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/health/ready && break; sleep 2; done
          curl -sf -X POST localhost:8000/api/v1/auth/register -H 'content-type: application/json' \
            -d '{"first_name":"Test","last_name":"Emulyator","email":"emulator@example.uz","password":"Kuchli-Parol-2026","password_confirm":"Kuchli-Parol-2026","university":"TATU","study_program":"60610100"}' > /dev/null
          echo "backend ready, test user created"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and inspect the APKs on an emulator
        id: smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 .github/scripts/android_e2e.py
      - name: Publish APKs and diagnostics to the communiai-apk branch
        if: always()
        working-directory: dist
        run: |
          git init -q -b communiai-apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf "# CommuniAI APK builds\n\nBuilt from %s (%s) by GitHub Actions run %s.\nEmulator smoke test: %s\n" \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "$(cat diagnostics/RESULT.txt 2>/dev/null || echo NOT RUN)" > README.md
          git add -A && git commit -q -m "CommuniAI APK build from ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" communiai-apk
      - name: Fail if the app did not start
        run: grep -q PASS dist/diagnostics/RESULT.txt
