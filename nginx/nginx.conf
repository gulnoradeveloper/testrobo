# HTTPS: production'da 443 port va sertifikat (masalan, certbot) qo'shing,
# shunda Django SECURE_SSL_REDIRECT/HSTS sozlamalari to'liq ishlaydi.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /static/ { alias /app/staticfiles/; expires 7d; }
    location /media/  {
        alias /app/media/;
        # Faqat rasmlar beriladi (yuklangan fayllar kod sifatida bajarilmaydi)
        location ~* \.(?!jpe?g$|png$|webp$)[^.]+$ { deny all; }
    }
    location ~ ^/(kirish|api/auth)/? {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
