<div class="field{% if field.errors %} has-error{% endif %}{% if extra_class %} {{ extra_class }}{% endif %}">
  {% if field.label %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>{% endif %}
  {{ field }}
  {% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}
  {{ field.errors }}
</div>
