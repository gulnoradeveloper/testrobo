# EfficientNet-B0 — asosiy nomzod (TT 10-bo‘lim boshlang‘ich parametrlari)
architecture: efficientnet_b0
model_version: efficientnet_b0-kl-1.0.0
manifest: data/splits/manifest_split.csv
output_dir: experiments/efficientnet_b0
artifact_path: artifacts/efficientnet_b0_best.pt
pretrained: true          # transfer learning: ImageNet vaznlari (download.pytorch.org yoki torch keshi)
# Internetsiz muhitda torchvision vaznlar faylini ko‘rsating:
# pretrained_weights: artifacts/imagenet/efficientnet_b0.pth
epochs: 50
batch_size: 32
learning_rate: 0.0001
weight_decay: 0.01
optimizer: adamw
loss: weighted_cross_entropy
early_stopping_patience: 7
selection_metric: macro_f1   # model tanlash faqat validation bo‘yicha
seed: 42
num_workers: 4
