<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Vector recreation of the CommuniAI logo: speech-bubble "C", circuit lines, presenter at a podium. -->
  <defs>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/><stop offset="0.45" stop-color="#2563EB"/><stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E40AF"/><stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/><stop offset="0.5" stop-color="#CBD5E1"/><stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="person" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0F2FE"/><stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>
  <!-- speech bubble with tail -->
  <path d="M512 92 C287 92 112 266 112 488 C112 600 158 700 234 772 L170 930 L360 850 C406 868 458 880 512 880 C737 880 912 710 912 488 C912 266 737 92 512 92 Z" fill="url(#bubble)"/>
  <!-- dark ring forming the C -->
  <path d="M512 168 C335 168 192 309 192 486 C192 663 335 804 512 804 C620 804 716 752 774 672 L688 612 C649 668 585 704 512 704 C391 704 294 607 294 486 C294 365 391 268 512 268 C585 268 649 304 688 360 L774 300 C716 220 620 168 512 168 Z" fill="url(#inner)"/>
  <!-- light interior of the C -->
  <circle cx="512" cy="486" r="212" fill="#FFFFFF"/>
  <!-- silver rim on the C ends -->
  <path d="M688 360 L774 300 C716 220 620 168 512 168 L512 200 C606 200 690 244 742 312 Z" fill="url(#silver)" opacity="0.95"/>
  <path d="M688 612 L774 672 C716 752 620 804 512 804 L512 772 C606 772 690 728 742 660 Z" fill="url(#silver)" opacity="0.95"/>
  <!-- circuit traces -->
  <g fill="none" stroke="#22D3EE" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M268 640 L268 470 L320 420 L320 330"/>
    <path d="M318 690 L318 520 L372 466 L372 300 L410 262"/>
    <path d="M360 720 L360 600"/>
  </g>
  <circle cx="320" cy="318" r="26" fill="url(#silver)" stroke="#22D3EE" stroke-width="6"/>
  <circle cx="424" cy="248" r="26" fill="#22D3EE"/>
  <circle cx="360" cy="588" r="22" fill="#22D3EE"/>
  <!-- presentation board with chart -->
  <rect x="566" y="350" width="210" height="160" rx="18" fill="#1E3A8A"/>
  <rect x="582" y="366" width="178" height="128" rx="10" fill="url(#screen)"/>
  <rect x="616" y="452" width="22" height="26" rx="4" fill="#1D4ED8"/>
  <rect x="652" y="428" width="22" height="50" rx="4" fill="#1D4ED8"/>
  <rect x="688" y="398" width="22" height="80" rx="4" fill="#1D4ED8"/>
  <!-- presenter -->
  <circle cx="530" cy="402" r="44" fill="url(#person)"/>
  <path d="M452 560 C452 492 486 456 530 456 C574 456 608 492 608 560 Z" fill="url(#person)"/>
  <!-- podium -->
  <rect x="438" y="546" width="190" height="34" rx="12" fill="url(#silver)"/>
  <path d="M462 580 L604 580 L588 700 L478 700 Z" fill="url(#person)" stroke="url(#silver)" stroke-width="8"/>
</svg>
