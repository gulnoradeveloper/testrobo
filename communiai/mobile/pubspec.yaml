publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.1.0
  flutter_markdown_plus: ^1.0.12
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
